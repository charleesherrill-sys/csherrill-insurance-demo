version: "3.8"

# Aegis Claims Platform — local demo stack.
# Copy .env.example to .env and fill in the required secrets first, then:
#   docker-compose up --build
# Compose fails fast (via the ${VAR:?...} syntax) if a required secret is unset.
# Then open http://localhost:8080 and log in (see README.md for seeded users).

services:
  db:
    image: postgres:12
    container_name: aegis-db
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${AEGIS_DB_PASSWORD:?set AEGIS_DB_PASSWORD in .env}
      POSTGRES_DB: aegis
    ports:
      - "5432:5432"
    volumes:
      # Schema + seed data are applied automatically on first boot.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - aegis-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: aegis-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      AEGIS_DB_URL: jdbc:postgresql://db:5432/aegis
      AEGIS_DB_USER: aegis
      AEGIS_DB_PASSWORD: ${AEGIS_DB_PASSWORD:?set AEGIS_DB_PASSWORD in .env}
      AEGIS_ADMIN_BOOTSTRAP_PASSWORD: ${AEGIS_ADMIN_BOOTSTRAP_PASSWORD:?set AEGIS_ADMIN_BOOTSTRAP_PASSWORD in .env}
      AEGIS_PAYMENT_GATEWAY_API_KEY: ${AEGIS_PAYMENT_GATEWAY_API_KEY:?set AEGIS_PAYMENT_GATEWAY_API_KEY in .env}
      AEGIS_FRAUD_SHARED_SECRET: ${AEGIS_FRAUD_SHARED_SECRET:?set AEGIS_FRAUD_SHARED_SECRET in .env}
    ports:
      - "8080:8080"
    volumes:
      - aegis-uploads:/var/aegis/uploads

volumes:
  aegis-pgdata:
  aegis-uploads:
