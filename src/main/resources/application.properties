# Aegis Claims Platform configuration.
#
# NOTE (see REVIEW.md): several values below are hardcoded fallback credentials and
# secrets (CWE-798). They are intentional for the demo and MUST NOT be "fixed" by
# extracting them to a vault unless that is the explicit task.

server.port=8080

# Mark the AEGIS_SESSION cookie Secure (HTTPS-only). Defaults to true; set
# AEGIS_COOKIE_SECURE=false for local http-only development/demo.
aegis.session.cookie.secure=${AEGIS_COOKIE_SECURE:true}

# Datasource — falls back to hardcoded dev credentials when env vars are absent.
aegis.db.url=${AEGIS_DB_URL:jdbc:postgresql://localhost:5432/aegis}
aegis.db.user=${AEGIS_DB_USER:aegis}
aegis.db.password=${AEGIS_DB_PASSWORD:aegis_dev_password}

spring.datasource.url=${aegis.db.url}
spring.datasource.username=${aegis.db.user}
spring.datasource.password=${aegis.db.password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10

# Thymeleaf — caching disabled so template edits show up during the demo.
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Document storage root for uploads/downloads.
aegis.documents.root=${AEGIS_DOC_ROOT:/var/aegis/uploads}

# Legacy default admin bootstrap (hardcoded — CWE-798).
aegis.admin.bootstrap.user=admin
aegis.admin.bootstrap.password=admin123

# Integration layer credentials (hardcoded — CWE-798).
aegis.integration.payment-gateway.url=https://payments.example-legacy.internal/api
aegis.integration.payment-gateway.api-key=pk_live_51H8xQ2eZvKYlo2C0hardcodedDEMOkey
aegis.integration.fraud.shared-secret=aegis-fraud-shared-secret-2016

logging.level.root=INFO
logging.level.com.aegis=DEBUG
