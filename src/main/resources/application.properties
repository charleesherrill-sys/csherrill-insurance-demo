# Aegis Claims Platform configuration.
#
# NOTE: Secrets must be supplied via environment variables. There are no hardcoded
# fallback values for credentials — the application will fail fast on startup if any
# required secret env var is absent.

server.port=8080

# Datasource — must be supplied via environment variables; no insecure defaults.
aegis.db.url=${AEGIS_DB_URL}
aegis.db.user=${AEGIS_DB_USER}
aegis.db.password=${AEGIS_DB_PASSWORD}

spring.datasource.url=${aegis.db.url}
spring.datasource.username=${aegis.db.user}
spring.datasource.password=${aegis.db.password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10

# Thymeleaf — caching disabled so template edits show up during the demo.
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Document storage root for uploads/downloads.
aegis.documents.root=${AEGIS_DOC_ROOT:/var/aegis/uploads}

# Admin bootstrap credentials must be supplied via environment variables.
aegis.admin.bootstrap.user=${AEGIS_ADMIN_USER}
aegis.admin.bootstrap.password=${AEGIS_ADMIN_PASSWORD}

# Integration layer credentials must be supplied via environment variables.
aegis.integration.payment-gateway.url=${AEGIS_PAYMENT_GATEWAY_URL}
aegis.integration.payment-gateway.api-key=${AEGIS_PAYMENT_GATEWAY_API_KEY}
aegis.integration.fraud.shared-secret=${AEGIS_FRAUD_SHARED_SECRET}

logging.level.root=INFO
logging.level.com.aegis=DEBUG
