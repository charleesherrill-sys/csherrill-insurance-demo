# Aegis Claims Platform configuration.
#
# Secrets (DB password, admin bootstrap password, payment-gateway API key, fraud
# shared secret) are NOT stored in this file. They are sourced exclusively from
# environment variables with no in-source default, so the application fails to
# start when a required secret is missing rather than falling back to a shipped
# credential. See README.md ("Configuration and secrets") and .env.example.

server.port=8080

# Datasource. The password has no in-source default and must be supplied via the
# AEGIS_DB_PASSWORD environment variable (fail-closed if unset).
aegis.db.url=${AEGIS_DB_URL:jdbc:postgresql://localhost:5432/aegis}
aegis.db.user=${AEGIS_DB_USER:aegis}
aegis.db.password=${AEGIS_DB_PASSWORD}

spring.datasource.url=${aegis.db.url}
spring.datasource.username=${aegis.db.user}
spring.datasource.password=${aegis.db.password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10

# Thymeleaf — caching disabled so template edits show up during the demo.
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Document storage root for uploads/downloads.
aegis.documents.root=${AEGIS_DOC_ROOT:/var/aegis/uploads}

# Admin bootstrap. The password is supplied via AEGIS_ADMIN_BOOTSTRAP_PASSWORD
# (no in-source default; fail-closed if unset).
aegis.admin.bootstrap.user=${AEGIS_ADMIN_BOOTSTRAP_USER:admin}
aegis.admin.bootstrap.password=${AEGIS_ADMIN_BOOTSTRAP_PASSWORD}

# Integration layer credentials — supplied via environment variables only
# (no in-source defaults; fail-closed if unset).
aegis.integration.payment-gateway.url=${AEGIS_PAYMENT_GATEWAY_URL:https://payments.example-legacy.internal/api}
aegis.integration.payment-gateway.api-key=${AEGIS_PAYMENT_GATEWAY_API_KEY}
aegis.integration.fraud.shared-secret=${AEGIS_FRAUD_SHARED_SECRET}

logging.level.root=INFO
logging.level.com.aegis=DEBUG
