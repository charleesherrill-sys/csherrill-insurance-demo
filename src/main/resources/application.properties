# Aegis Claims Platform configuration.
#
# NOTE (see REVIEW.md): sensitive integration and bootstrap values come from the
# environment and have no built-in defaults.

server.port=8080

# Datasource — uses local-development defaults when env vars are absent.
aegis.db.url=${AEGIS_DB_URL:jdbc:postgresql://localhost:5432/aegis}
aegis.db.user=${AEGIS_DB_USER:aegis}
aegis.db.password=${AEGIS_DB_PASSWORD:aegis_dev_password}

spring.datasource.url=${aegis.db.url}
spring.datasource.username=${aegis.db.user}
spring.datasource.password=${aegis.db.password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10

# Thymeleaf — caching disabled so template edits show up during the demo.
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Document storage root for uploads/downloads.
aegis.documents.root=${AEGIS_DOC_ROOT:/var/aegis/uploads}

# Legacy default admin bootstrap (provided by the environment).
aegis.admin.bootstrap.user=admin
aegis.admin.bootstrap.password=${AEGIS_ADMIN_BOOTSTRAP_PASSWORD}

# Integration layer credentials (provided by the environment).
aegis.integration.payment-gateway.url=https://payments.example-legacy.internal/api
aegis.integration.payment-gateway.api-key=${PAYMENT_GATEWAY_API_KEY}
aegis.integration.fraud.shared-secret=${FRAUD_SHARED_SECRET}

logging.level.root=INFO
logging.level.com.aegis=DEBUG
