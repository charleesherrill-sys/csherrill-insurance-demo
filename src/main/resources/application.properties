# Aegis Claims Platform configuration.
#
# SECURITY (CWE-798): the integration API key, fraud shared secret, and admin
# bootstrap password are injected from the environment with NO insecure defaults.
# If a required secret is absent, placeholder resolution fails and the application
# refuses to start (fail fast) rather than falling back to a hardcoded value.

server.port=8080

# Datasource — falls back to hardcoded dev credentials when env vars are absent.
aegis.db.url=${AEGIS_DB_URL:jdbc:postgresql://localhost:5432/aegis}
aegis.db.user=${AEGIS_DB_USER:aegis}
aegis.db.password=${AEGIS_DB_PASSWORD:aegis_dev_password}

spring.datasource.url=${aegis.db.url}
spring.datasource.username=${aegis.db.user}
spring.datasource.password=${aegis.db.password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10

# Thymeleaf — caching disabled so template edits show up during the demo.
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Document storage root for uploads/downloads.
aegis.documents.root=${AEGIS_DOC_ROOT:/var/aegis/uploads}

# Admin bootstrap. The username is non-sensitive; the password is a required
# secret injected from the environment with no default (fail fast if absent).
aegis.admin.bootstrap.user=${AEGIS_ADMIN_BOOTSTRAP_USER:admin}
aegis.admin.bootstrap.password=${AEGIS_ADMIN_BOOTSTRAP_PASSWORD}

# Integration layer credentials. Secrets are injected from the environment with
# no insecure defaults (fail fast if absent).
aegis.integration.payment-gateway.url=${AEGIS_PAYMENT_GATEWAY_URL:https://payments.example-legacy.internal/api}
aegis.integration.payment-gateway.api-key=${AEGIS_PAYMENT_GATEWAY_API_KEY}
aegis.integration.fraud.shared-secret=${AEGIS_FRAUD_SHARED_SECRET}

logging.level.root=INFO
logging.level.com.aegis=DEBUG
