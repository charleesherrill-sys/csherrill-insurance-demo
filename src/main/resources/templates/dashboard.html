<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Dashboard — Aegis</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<header th:replace="fragments/nav :: topbar('dashboard')"></header>
<div class="container">
    <h1>Welcome, <span th:text="${user.username}">member</span></h1>

    <div class="card">
        <h2>Outstanding balance</h2>
        <div class="metric" th:text="'$' + ${#numbers.formatDecimal(totalOutstandingCents / 100.0, 1, 'COMMA', 2, 'POINT')}">$0.00</div>
        <p class="muted"><a th:href="@{/billing}">View billing &raquo;</a></p>
    </div>

    <div class="card">
        <h2>Your policies</h2>
        <table>
            <thead><tr><th>Policy #</th><th>Product</th><th>Status</th></tr></thead>
            <tbody>
                <tr th:each="p : ${policies}">
                    <td th:text="${p.policyNumber}">POL</td>
                    <td th:text="${p.product}">Product</td>
                    <td><span class="badge" th:classappend="${p.status}" th:text="${p.status}">ACTIVE</span></td>
                </tr>
                <tr th:if="${policies.isEmpty()}"><td colspan="3" class="muted">No policies.</td></tr>
            </tbody>
        </table>
    </div>

    <div class="card">
        <h2>Recent claims</h2>
        <table>
            <thead><tr><th>Claim #</th><th>Type</th><th>Amount</th><th>Status</th><th></th></tr></thead>
            <tbody>
                <tr th:each="c : ${claims}">
                    <td th:text="${c.claimNumber}">CLM</td>
                    <td th:text="${c.claimType}">MEDICAL</td>
                    <td th:text="${c.amountDisplay}">$0.00</td>
                    <td><span class="badge" th:classappend="${c.status}" th:text="${c.status}">SUBMITTED</span></td>
                    <td><a th:href="@{'/claims/' + ${c.id}}">View</a></td>
                </tr>
                <tr th:if="${claims.isEmpty()}"><td colspan="5" class="muted">No claims.</td></tr>
            </tbody>
        </table>
        <p style="margin-top:14px;"><a class="btn" th:href="@{/claims/new}">File a new claim</a></p>
    </div>
</div>
</body>
</html>
