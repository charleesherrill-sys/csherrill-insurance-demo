<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/></head>
<body>

    <div class="brand">AEGIS <span style="font-weight:400;font-size:13px;">Claims Platform</span></div>
    <nav>
        <a th:href="@{/dashboard}" th:classappend="${active=='dashboard'} ? 'active'">Dashboard</a>
        <a th:href="@{/claims}" th:classappend="${active=='claims'} ? 'active'">Claims</a>

</body>
</html>
